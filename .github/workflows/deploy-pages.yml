# 部署到 GitHub Pages
#
# 前置（在 GitHub 网页上做一次，之后就不用管了）：
#   1. 仓库 Settings → Pages → Build and deployment → Source 选 **GitHub Actions**
#   2. 仓库 Settings → Secrets and variables → Actions → New repository secret，加三条：
#        VITE_AMAP_KEY / VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
#      （不加密提交到仓库会泄露高德 Key，所以必须走 Secrets；三条都不加也能部署成功，
#        只是应用会跑在「本地模式」：无登录/云同步，天气卡显示配置引导）
#   3. Supabase → Authentication → URL Configuration 里加上部署后的地址与回跳：
#        https://<用户名>.github.io/<仓库名>/**   （GitHub OAuth 与邮件链接都靠它）
#
# 站点地址：https://<用户名>.github.io/<仓库名>/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也允许在 Actions 页面手动点一下重新部署
  workflow_dispatch:

# GitHub Pages 要求的最小权限集
permissions:
  contents: read
  pages: write
  id-token: write
  # 清理陈旧部署记录（Deployments API）需要它
  deployments: write

# 同一时间只跑一个部署；新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 测试不过就不发版：部署产物必须是绿的
      - name: 运行测试
        run: pnpm test

      - name: 构建
        env:
          # 项目站点部署在 /<仓库名>/ 子路径下，必须告诉 Vite
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          pnpm build
          # SPA 回退：Pages 对未知路径返回 404.html，让它也是应用入口，
          # 这样直接访问 /<repo>/todos 刷新不会白屏（路由会自己解析路径）
          cp dist/index.html dist/404.html
          # 关掉 Jekyll 处理，避免以 _ 开头的产物被丢弃
          touch dist/.nojekyll

      - name: 检查 Pages 是否已开启
        continue-on-error: true
        run: |
          # 默认 GITHUB_TOKEN 无权替仓库开启 Pages（GitHub 的限制），所以首次必须先手动开一次。
          # 这里先探一下，未开启就在日志里直接给出该点哪里，省得对着一片红猜原因。
          if ! curl -sSf -o /dev/null \
               -H "Authorization: Bearer ${{ github.token }}" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages"; then
            echo "::warning title=Pages 尚未开启::请到仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」，然后重新运行本工作流"
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 已开启后这里只是读取配置；未开启时尝试自动开启（需要仓库管理员权限，
          # 用默认 GITHUB_TOKEN 通常会失败——那就按上一步 warning 里的提示手动开一次）
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 踩过的坑（GitHub 已知问题，见 actions/deploy-pages#22）：
      # 部署被取消/中断后会残留一条 in-progress 的 Pages 部署，之后每次部署都被 400 拒绝：
      #   "Deployment request failed ... due to in progress deployment. Please cancel <sha> first"
      # 而仓库 Deployments 列表里那条显示的是 failure——两套账，很容易白查半天。
      # 官方给的路子是"取消/删除那条部署"；这里在部署前把陈旧（非 success）的部署标为 inactive 并删除，
      # 让流程自愈。删部署记录不会影响已经发布出去的内容。
      - name: 清理陈旧的部署记录
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const currentSha = context.sha
            let cleaned = 0
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, environment: 'github-pages', per_page: 100,
              })
              for (const d of deployments) {
                if (d.sha === currentSha) continue
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: d.id, per_page: 1,
                })
                const state = statuses[0] && statuses[0].state
                // 只清理"没成功"的：success 的记录留着（正在对外服务的那次），inactive 无需重复处理
                if (state === 'success' || state === 'inactive') continue
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: d.id, state: 'inactive',
                  description: 'superseded by a newer deployment',
                })
                await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id })
                cleaned += 1
                core.info(`已清理陈旧部署 ${d.id}（sha=${d.sha.slice(0, 7)}, state=${state}）`)
              }
              core.info(cleaned ? `共清理 ${cleaned} 条陈旧部署` : '没有需要清理的陈旧部署')
            } catch (error) {
              // 清理失败不阻塞本次部署（例如 token 权限不足）：留个 warning 继续走
              core.warning(`清理陈旧部署时出错（不阻塞本次部署）：${error.message}`)
            }

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
